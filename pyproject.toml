[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-kgo"
# Always start at least at 0.2.0 to make semver work.
# Initial release for semver needs also a manually pushed minimum tag (likely 0.2.0).
version = "0.2.0"
description = "Open Knowledge Graphs and Ontologies plugin for mloda."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Tom Kaltofen", email = "tomkaltofen@mloda.ai" }]
dependencies = ["mloda>=0.6.1", "mloda-testing>=0.3.1"]
requires-python = ">=3.10"
# License classifier intentionally omitted: `license` above is an SPDX
# expression (PEP 639), and newer setuptools rejects a `License ::` trove
# classifier alongside it.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mloda-ai/open-kgo"
Repository = "https://github.com/mloda-ai/open-kgo"
Issues = "https://github.com/mloda-ai/open-kgo/issues"

[project.optional-dependencies]
dev = [
    "tox",
    "tox-uv",
    "uv>=0.11.6",
    "pytest",
    "ruff",
    "mypy",
    "bandit",
]
kg-rdf = ["rdflib>=7.0"]
kg-embedded = ["networkx>=3.2"]
kg-network-pg = ["kuzu>=0.4"]
kg-memory = ["networkx>=3.2"]
kg-ontology = ["pyyaml>=6.0"]
kg-rest = []
kg-lineage = []
kg-codebuild = []
kg-saas = []
kg-citation = []
kg-all = [
    "open-kgo[kg-rdf,kg-embedded,kg-network-pg,kg-memory,kg-rest,kg-lineage,kg-codebuild,kg-saas,kg-citation,kg-ontology]",
]
demo = ["marimo", "open-kgo[kg-all]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_kgo*"]

# Ship the PEP 561 marker so the `Typing :: Typed` classifier is honoured:
# without it, mypy/pyright in downstream projects ignore this package's inline
# types even though every module is fully annotated.
[tool.setuptools.package-data]
open_kgo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["open_kgo", "tests"]
python_files = ["test_*.py"]
markers = [
    "notebooks: end-to-end execution of demo marimo notebooks (slow; needs the 'demo' extra). Deselect with -m 'not notebooks'.",
]

[tool.ruff]
line-length = 120
exclude = ["demo/*.py"]

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
exclude = ["demo/", "build/"]

[tool.bandit]
exclude_dirs = [".tox", ".venv", "tests", "demo"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { mloda = "2026-12-31", "mloda-testing" = "2026-12-31", "mloda-registry" = "2026-12-31" }
