[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "open-kgo"
# semantic-release bumps the latest git tag; needs a `0.2.0` tag pushed once by
# hand to bootstrap. The mloda floor (>=0.10.0) is unrelated.
version = "0.3.1"
description = "Open Knowledge Graphs and Ontologies plugin for mloda."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Tom Kaltofen", email = "tomkaltofen@mloda.ai" }]
dependencies = ["mloda>=0.10.0"]
requires-python = ">=3.10"
# No `License ::` trove classifier: `license` above is an SPDX expression
# (PEP 639) and setuptools rejects both together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mloda-ai/open-kgo"
Repository = "https://github.com/mloda-ai/open-kgo"
Issues = "https://github.com/mloda-ai/open-kgo/issues"

[project.optional-dependencies]
# mloda-testing is exercised only by tests/test_mloda_imports.py (import smoke);
# the KG contract harness is in-repo. Dev-only: test trees are out of the wheel.
dev = [
    "tox",
    "tox-uv",
    "uv>=0.11.6",
    "pytest",
    "ruff",
    "mypy",
    "bandit",
    "mloda-testing>=0.3.2",
]
kg-rdf = ["rdflib>=7.0", "pyoxigraph>=0.5.9"]
kg-embedded = ["networkx>=3.2", "igraph>=0.11"]
kg-network-pg = ["kuzu>=0.4", "networkx>=3.2", "grand-cypher>=0.12"]
kg-memory = ["networkx>=3.2"]
kg-ontology = ["pyyaml>=6.0"]
kg-semantic-field = ["pyyaml>=6.0"]
# Pure-stdlib families: extras intentionally empty so every family installs via
# `open-kgo[kg-<family>]` and `kg-all` lists them uniformly. Do not delete.
kg-rest = []
kg-lineage = []
kg-codebuild = []
kg-saas = []
kg-citation = []
kg-all = [
    "open-kgo[kg-rdf,kg-embedded,kg-network-pg,kg-memory,kg-rest,kg-lineage,kg-codebuild,kg-saas,kg-citation,kg-ontology,kg-semantic-field]",
]
demo = ["marimo", "open-kgo[kg-all]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_kgo*"]
# The in-repo test contract harness stays out of the wheel: its fixtures are
# not packaged, so shipping the test modules alone would be a broken artifact.
exclude = ["*.tests", "*.tests.*"]

# PEP 561 marker so the `Typing :: Typed` classifier is honoured (downstream
# type-checkers otherwise ignore this package's inline types).
[tool.setuptools.package-data]
open_kgo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["open_kgo", "tests"]
python_files = ["test_*.py"]
markers = [
    "notebooks: end-to-end execution of demo marimo notebooks (slow; needs the 'demo' extra). Deselect with -m 'not notebooks'.",
]

[tool.ruff]
line-length = 120
# demo/ is linted (it ships and runs in CI notebook tests). mypy/bandit still
# skip it: marimo's cell style resists typing and demos aren't importable.

[tool.mypy]
strict = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# Anchored: an unanchored "build/" also matches open_kgo/.../code_build/,
# silently dropping that package from the repo-wide mypy run.
exclude = ["^demo/", "^build/"]

[tool.bandit]
exclude_dirs = [".tox", ".venv", "tests", "demo"]

[tool.uv]
# Supply-chain cooldown: ignore third-party releases younger than 7 days.
exclude-newer = "7 days"
# First-party mloda packages are exempt (rolling "0 days"): we want their latest
# releases immediately, accepting no quarantine window. Do NOT add third-party
# packages here. Owner: tk.
exclude-newer-package = { mloda = "0 days", "mloda-testing" = "0 days", "mloda-registry" = "0 days" }
# Overrides, not constraints: marimo pins `pymdown-extensions<11`, and the fix for the
# b64 path-traversal advisory only ships in 11.0. A constraint cannot beat that upper
# pin, so the pin is overridden here. Drop this once marimo allows 11.x.
override-dependencies = [
    "pymdown-extensions>=11.0.1",
]
