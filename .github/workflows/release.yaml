name: Release

on:
  workflow_dispatch:

jobs:
  github_release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ">=0.13.4,<0.14"

      - name: Install semantic release and plugins
        run: |
          npm install -g semantic-release@v24.2.1 \
            conventional-changelog-cli \
            conventional-changelog-conventionalcommits@9.3.1 \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Semantic Release Dry Run
        id: semantic
        run: |
          dry_run_output=$(semantic-release --dry-run 2>&1 || true)

          echo "$dry_run_output"

          # Check if there are no changes
          if [[ "$dry_run_output" == *"no new version is released"* ]]; then
            echo "No new release needed"
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract version from dry run output
          version=$(echo "$dry_run_output" | grep -oP "The next release version is \K[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$version" ]; then
            echo "::error ::Could not determine version"
            exit 1
          fi

          echo "new_release_version=$version" >> $GITHUB_OUTPUT

          # Run actual release
          if semantic-release; then
            echo "Release successful"
            echo "new_release_published=true" >> $GITHUB_OUTPUT
          else
            echo "Release failed"
            exit 1
          fi
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  # Build once from the release tag; TestPyPI, the smoke test and publish-pypi.yaml all use these exact files.
  build:
    name: Build
    needs: github_release
    if: needs.github_release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.github_release.outputs.new_release_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ">=0.13.4,<0.14"

      - name: Build wheel and sdist
        run: uv build

      - name: Check the wheel ships no test-only modules
        run: |
          unzip -Z1 dist/*.whl > wheel-files.txt
          if ! grep -qx 'open_kgo/__init__.py' wheel-files.txt; then
            echo "::error ::The wheel listing has no open_kgo/__init__.py"
            exit 1
          fi
          if grep -E '(^|/)(conftest\.py$|tests/)' wheel-files.txt; then
            echo "::error ::The wheel holds test-only modules (listed above)"
            exit 1
          fi
          echo "Checked $(wc -l < wheel-files.txt) wheel entries, none test-only"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted Publishing: the OIDC token is traded for a short-lived upload token bound to this repo, workflow and
  # environment. No PyPI secret is stored. PyPI itself is published by publish-pypi.yaml.
  publish_testpypi:
    name: Publish to TestPyPI
    needs: [github_release, build]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/open-kgo/${{ needs.github_release.outputs.new_release_version }}/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # open-kgo comes from TestPyPI, its dependencies from PyPI (TestPyPI is open to anyone).
  smoke_testpypi:
    name: Smoke test from TestPyPI
    needs: [github_release, publish_testpypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.github_release.outputs.new_release_version }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ">=0.13.4,<0.14"

      - name: Fetch the wheel TestPyPI serves and compare it with the build
        run: |
          (cd dist && sha256sum -- *) | sort -k 2 > built.sha256
          for attempt in $(seq 1 20); do  # a new release can take a few minutes to show up
            if curl -fsS "https://test.pypi.org/pypi/open-kgo/$VERSION/json" -o release.json; then
              jq -r '.urls[] | "\(.digests.sha256)  \(.filename)"' release.json | sort -k 2 > served.sha256
              if cmp -s built.sha256 served.sha256; then
                break
              fi
            fi
            if [ "$attempt" = 20 ]; then
              echo "::error ::TestPyPI does not serve the files built for $VERSION"
              diff built.sha256 served.sha256 || true
              exit 1
            fi
            sleep 15
          done
          mkdir testpypi
          wheel_url=$(jq -r '.urls[] | select(.packagetype == "bdist_wheel") | .url' release.json)
          curl -fsSL -o "testpypi/${wheel_url##*/}" "$wheel_url"
          (cd testpypi && grep -F -- "${wheel_url##*/}" ../served.sha256 | sha256sum -c -)

      - name: Install and import as a user would
        run: |
          wheel=$(ls testpypi/*.whl)
          uv venv --python 3.11 smoke
          uv pip install --python smoke "open-kgo @ file://$PWD/$wheel"
          smoke/bin/python -c "import importlib.metadata as m, open_kgo; assert m.version('open-kgo') == '$VERSION'"

  # Only a smoke-tested version gets its files on the GitHub release, where publish-pypi.yaml takes them.
  attach_to_release:
    name: Attach to the GitHub release
    needs: [github_release, smoke_testpypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.github_release.outputs.new_release_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload the files to the release
        run: gh release upload "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
