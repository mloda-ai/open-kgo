name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

# Least-privilege token: these jobs only read the repo to run tests. Declared
# explicitly so the workflow does not inherit a wider default GITHUB_TOKEN
# scope if the repo/org default changes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          # Pinned: a uv minor bump can change lockfile serialization.
          python -m pip install "uv>=0.12,<0.13"
          uv tool install tox --with tox-uv

      - name: Run tox
        run: tox
        timeout-minutes: 3

  notebooks:
    # Demo marimo notebooks are slow to execute end-to-end, so they run as a
    # separate tox env (not part of the default `tox` above) to keep the main
    # matrix fast. Run across every supported Python version like `test`.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          # Pinned: a uv minor bump can change lockfile serialization.
          python -m pip install "uv>=0.12,<0.13"
          uv tool install tox --with tox-uv

      - name: Run notebook tests
        run: tox -e notebooks
        timeout-minutes: 5
