name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    # 3.14 is allowed to fail (continue-on-error): kuzu has no cp314 wheel yet,
    # so the kg-all install may not resolve. fail-fast: false keeps 3.10-3.13
    # reporting even if 3.14 breaks. Flip experimental off once kuzu ships 3.14.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv tool install tox --with tox-uv

      - name: Run tox
        run: tox
        timeout-minutes: 2

  notebooks:
    # Demo marimo notebooks are slow to execute end-to-end, so they run as a
    # separate tox env (not part of the default `tox` above) to keep the main
    # matrix fast. Run across every supported Python version like `test`.
    # 3.14 is allowed to fail (see the `test` job note: kuzu has no cp314 wheel).
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv tool install tox --with tox-uv

      - name: Run notebook tests
        run: tox -e notebooks
        timeout-minutes: 5
