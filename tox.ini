[tox]
envlist = python310

[testenv]
usedevelop = true
extras =
    dev
    kg-all
allowlist_externals = sh
commands =
    pytest -m "not notebooks"
    ruff format --check --line-length 120 .
    ruff check .
    mypy --strict --ignore-missing-imports .
    bandit -c pyproject.toml -r -q .

[testenv:notebooks]
# End-to-end execution of the demo marimo notebooks (slow, ~5s each).
# Kept out of the default env so local `tox` stays fast; CI runs this as a
# separate `tox -e notebooks` job (see .github/workflows/test.yml). The
# `demo` extra pulls in marimo (and kg-all, which the notebooks exercise).
usedevelop = true
extras =
    dev
    kg-all
    demo
allowlist_externals = sh
commands =
    pytest -m notebooks

[testenv:security]
# CVE scanning environment - builds and scans the local package
usedevelop = true
extras = dev
deps =
    pip-audit
allowlist_externals = sh, mkdir
commands =
    mkdir -p security-reports

    sh -c "pip list"

    # Run CVE scan on installed dependencies
    sh -c "pip-audit --desc --format=json --output=security-reports/pip-audit.json || pip-audit --desc"

    # Display summary
    sh -c "echo '=== CVE Scan Summary ==='"
    sh -c "echo 'Tool: pip-audit (Apache 2.0 licensed)'"
    sh -c "echo 'Report: security-reports/pip-audit.json'"
