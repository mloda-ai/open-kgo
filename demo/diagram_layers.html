<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open-KGO — Three Layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      font-family: 'Geist', sans-serif;
      padding: 2.5rem 2.5rem 2rem;
      max-width: 1080px;
      margin: 0 auto;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 0.6875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #2d3142;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-family: 'Geist', sans-serif;
      font-size: 0.875rem;
      color: #7a8399;
      margin-bottom: 2rem;
    }
    .diagram-wrap { overflow-x: auto; }
    .footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(45,49,66,0.12);
      font-family: 'Geist Mono', monospace;
      font-size: 0.6875rem;
      color: #7a8399;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <p class="eyebrow">Open-KGO · Architecture</p>
  <h1>Three Layers</h1>
  <p class="subtitle">Binary validation → semantic field scoring → ranked discovery.</p>

  <div class="diagram-wrap">
    <svg viewBox="0 0 1000 344" xmlns="http://www.w3.org/2000/svg"
         style="width:100%;max-width:1000px;display:block;">

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Page background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Left margin: direction indicator -->
      <!-- Vertical label centered on the stack (y=64 to y=272, center=168) -->
      <text transform="rotate(-90, 24, 168)"
            x="24" y="168"
            fill="#bfc0c0"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.14em">ABSTRACTION ↑</text>
      <line x1="40" y1="64" x2="40" y2="272"
            stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8"/>

      <!-- ══════════════════════════════════════════════════
           LAYER 3 — Discovery Engine  (FUTURE / PLANNED)
           y=64, h=68  — optional / dashed
           ══════════════════════════════════════════════════ -->
      <rect x="52" y="64" width="908" height="68" rx="4"
            fill="rgba(45,49,66,0.02)"
            stroke="rgba(45,49,66,0.20)"
            stroke-width="1"
            stroke-dasharray="4,3"/>

      <!-- Index tag -->
      <rect x="64" y="88" width="28" height="16" rx="2"
            fill="transparent"
            stroke="rgba(45,49,66,0.20)"
            stroke-width="0.8"/>
      <text x="78" y="100"
            fill="#7a8399"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em">L3</text>

      <!-- Layer name -->
      <text x="104" y="104"
            fill="#7a8399"
            font-size="16"
            font-weight="600"
            font-family="'Geist', sans-serif">Discovery Engine</text>

      <!-- Status badge: PLANNED -->
      <rect x="284" y="88" width="60" height="16" rx="2"
            fill="rgba(45,49,66,0.04)"
            stroke="rgba(45,49,66,0.16)"
            stroke-width="0.8"/>
      <text x="314" y="100"
            fill="#7a8399"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.06em">PLANNED</text>

      <!-- Sublabel, right-aligned -->
      <text x="940" y="100"
            fill="#7a8399"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="end">mloda.discover(start, goal_type, namespace)  ·  ranked paths by field strength</text>

      <!-- ══════════════════════════════════════════════════
           LAYER 2 — SemanticField  (BUILT / FOCAL)
           y=132, h=72  — accent / focal treatment
           ══════════════════════════════════════════════════ -->
      <!-- Paper mask so adjacent layer borders don't bleed through -->
      <rect x="52" y="132" width="908" height="72" rx="4" fill="#f5f5f5"/>
      <rect x="52" y="132" width="908" height="72" rx="4"
            fill="rgba(235,108,54,0.08)"
            stroke="#eb6c36"
            stroke-width="1.2"/>

      <!-- Index tag -->
      <rect x="64" y="160" width="28" height="16" rx="2"
            fill="transparent"
            stroke="rgba(235,108,54,0.40)"
            stroke-width="0.8"/>
      <text x="78" y="172"
            fill="#eb6c36"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em">L2</text>

      <!-- Layer name (accent colour signals focal) -->
      <text x="104" y="176"
            fill="#eb6c36"
            font-size="16"
            font-weight="600"
            font-family="'Geist', sans-serif">SemanticField</text>

      <!-- Status badge: BUILT (accent) -->
      <rect x="244" y="160" width="40" height="16" rx="2"
            fill="rgba(235,108,54,0.12)"
            stroke="rgba(235,108,54,0.40)"
            stroke-width="0.8"/>
      <text x="264" y="172"
            fill="#eb6c36"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.06em">BUILT</text>

      <!-- Sublabel line 1 -->
      <text x="940" y="168"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="end">compute(anchors)  ·  compute_and(source, sink)</text>
      <!-- Sublabel line 2 (extra info for the focal layer) -->
      <text x="940" y="184"
            fill="#7a8399"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="end">ontology weights → conductances  ·  score = electric current</text>

      <!-- ══════════════════════════════════════════════════
           LAYER 1 — OntologyRegistry  (BUILT / FOUNDATION)
           y=204, h=68  — backend / solid treatment
           ══════════════════════════════════════════════════ -->
      <rect x="52" y="204" width="908" height="68" rx="4" fill="#f5f5f5"/>
      <rect x="52" y="204" width="908" height="68" rx="4"
            fill="#ffffff"
            stroke="#2d3142"
            stroke-width="1"/>

      <!-- Index tag -->
      <rect x="64" y="228" width="28" height="16" rx="2"
            fill="transparent"
            stroke="rgba(45,49,66,0.40)"
            stroke-width="0.8"/>
      <text x="78" y="240"
            fill="#2d3142"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.08em">L1</text>

      <!-- Layer name -->
      <text x="104" y="244"
            fill="#2d3142"
            font-size="16"
            font-weight="600"
            font-family="'Geist', sans-serif">OntologyRegistry</text>

      <!-- Status badge: BUILT -->
      <rect x="284" y="228" width="40" height="16" rx="2"
            fill="rgba(45,49,66,0.06)"
            stroke="rgba(45,49,66,0.20)"
            stroke-width="0.8"/>
      <text x="304" y="240"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            text-anchor="middle"
            letter-spacing="0.06em">BUILT</text>

      <!-- Sublabel, right-aligned -->
      <text x="940" y="244"
            fill="#4f5d75"
            font-size="9"
            font-family="'Geist Mono', monospace"
            text-anchor="end">is_valid_edge()  ·  get_range_type()  ·  YAML ontology  ·  binary valid / invalid</text>

      <!-- ══════════════════════════════════════════════════
           LEGEND — horizontal strip
           ══════════════════════════════════════════════════ -->
      <line x1="52" y1="288" x2="948" y2="288"
            stroke="rgba(45,49,66,0.10)"
            stroke-width="0.8"/>

      <text x="52" y="304"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace"
            letter-spacing="0.14em">LEGEND</text>

      <!-- Solid: built / stable -->
      <rect x="116" y="292" width="24" height="16" rx="2"
            fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="304"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace">Built / stable</text>

      <!-- Accent: focal layer -->
      <rect x="248" y="292" width="24" height="16" rx="2"
            fill="rgba(235,108,54,0.08)"
            stroke="#eb6c36"
            stroke-width="1.2"/>
      <text x="280" y="304"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace">Focal — new this release</text>

      <!-- Dashed: planned -->
      <rect x="432" y="292" width="24" height="16" rx="2"
            fill="rgba(45,49,66,0.02)"
            stroke="rgba(45,49,66,0.20)"
            stroke-width="1"
            stroke-dasharray="4,3"/>
      <text x="464" y="304"
            fill="#4f5d75"
            font-size="8"
            font-family="'Geist Mono', monospace">Planned (not yet built)</text>

    </svg>
  </div>

  <footer class="footer">
    open-kgo · semantic field architecture · feat/semantic-field
  </footer>

</body>
</html>
